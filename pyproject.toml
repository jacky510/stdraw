[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stdraw"
version = "0.9.0"
description = "Planarity-aware system-thinking (CLD) diagram engine with honest, metric-backed quality certificates"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "stdraw contributors" }]
keywords = [
  "systems-thinking",
  "causal-loop-diagram",
  "cld",
  "diagram",
  "graph-layout",
  "planarity",
  "agent-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
solver = ["ortools>=9.10"]          # auto-v2 placement refinement (optional; degrades gracefully to the constructive method when absent)
measure = ["pillow>=10.0"]          # true box-bound measurement (optional; falls back to conservative analytic estimates when absent)
render-check = ["playwright>=1.40"] # CI-side DOM box-bound measurement (optional layer)

[project.scripts]
stdraw = "stdraw.__main__:main"

[tool.setuptools]
packages = ["stdraw", "stdraw.data"]

[tool.setuptools.package-data]
# Packaged runtime data (T3): anchor-prior library + aesthetic M0 models +
# topology family labels must ship inside the wheel/sdist so pip installs
# behave identically to a git clone (importlib.resources reads them).
"stdraw.data" = ["*.json"]

[tool.pytest.ini_options]
markers = [
    # repo-only data guard (packaging T6): args are repo-root-relative paths
    # that must exist; tests are auto-skipped with the missing paths in the
    # reason when absent (e.g. running pytest from an sdist extraction).
    "repo(...): test needs repo-only data (paths relative to the repo root)",
]
