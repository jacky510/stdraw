[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stdraw"
version = "0.1.0"
description = "Planarity-aware system-thinking (CLD) diagram engine with honest, metric-backed quality certificates"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "stdraw contributors" }]
keywords = [
  "systems-thinking",
  "causal-loop-diagram",
  "cld",
  "diagram",
  "graph-layout",
  "planarity",
  "agent-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["networkx>=3.0"]

[project.scripts]
stdraw = "stdraw.__main__:main"

[tool.setuptools]
packages = ["stdraw"]
