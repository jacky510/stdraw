name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Saturdays 03:00 UTC = 11:00 UTC+8 — weekly full 3.9 compatibility sweep
    - cron: "0 3 * * 6"
    # TEMP (evidence harness, removed in the next commit): a 5-minute tick so
    # the push-vs-schedule isolation can be observed without waiting a week.
    - cron: "*/5 * * * *"
  # Manual entry so the weekly 3.9 sweep (and the whole matrix) can be
  # reproduced on demand instead of waiting for the Saturday tick.
  workflow_dispatch:

concurrency:
  # The event name is part of the group on purpose. Push and schedule both run
  # on refs/heads/main, so a ref-only group put them in one lane and the later
  # schedule tick cancelled the in-flight push run: run 46138593952 (push) was
  # cancelled by the 11:15 schedule run 46139007908, leaving that commit's push
  # run without a verdict. Runs of the same event on one ref still cancel each
  # other, which is the behaviour worth keeping (consecutive pushes to main).
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Job split (2026-11-10 bottleneck-localization card): the single
# "Full checks" step measured 941s-2809s across runs of identical content
# (slow-VM lottery dominates the tail). Coverage-preserving split into
# three parallel jobs; phases selected via STDRAW_CI_PHASES in
# tests/ci_checks.py (_on() selector — local default stays all-phases).
# Dependency pinning: C needs B outputs, F2 needs F, G2/G3 follow G,
# J/H3 reuse H2 outputs — kept within one job each.
jobs:
  checks-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Internal-leak sanitization gate"
        run: python scripts/check_internal_leaks.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "Install core + render-check (playwright, DOM bounds layer)"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[render-check]"
      - name: "Resolve playwright version"
        id: pwver
        run: echo "ver=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pwver.outputs.ver }}
      - name: "Playwright chromium (skips download on cache hit)"
        run: playwright install chromium
      - name: CLI help smoke
        run: |
          stdraw --help
          python -m stdraw layout --help
      - name: "Core gates: auto hard gates + DOM bounds + manual round-trip + ring + demo freshness"
        env:
          STDRAW_CI_PHASES: B,C,F,G,I
        run: python tests/ci_checks.py

  checks-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Internal-leak sanitization gate"
        run: python scripts/check_internal_leaks.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Corpus phase dependency decision (2026-11-10; empirically
      # bisected locally on random-n10-i01.cld, Python 3.12):
      #   - solver (ortools) is REQUIRED: B2 runs `--recipe auto`, whose
      #     auto-v2 placement refinement needs ortools. The stdlib-only
      #     constructive fallback drifts on dense random graphs and fails the
      #     hard gates — reproduced locally with `pip install -e .` only:
      #     "FAIL 9 simple-graph placement regularity (column snap 0.40)" and
      #     "FAIL 13 path_d render/verify geometry deviation 3.5px(N03->N09) /
      #     8.2px(N04->N09) + arc G1 tangent continuity", exactly matching the
      #     first CI failure of this job (run 42667887729). With solver
      #     installed (measure/render-check absent) the same example exits 0.
      #   - measure (pillow) is NOT needed: measure-only still failed the same
      #     two gates; and the full corpus phases (B2,H2,J,H3) pass green in a
      #     solver-only env (full phase run recorded in the bisect).
      #   - render-check (playwright) is NOT needed: corpus phases never invoke
      #     stdraw.rendercheck — DOM measurement is phase C, owned by
      #     checks-core, which installs render-check itself.
      #     Phase M (golden archetype gate, tests/golden_gate.py) runs here
      #     for the same solver reason: its baseline is recorded under the
      #     cp-sat engine and the gate refuses a fallback-construct run.
      - name: "Install (solver layer: --recipe auto placement refinement)"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[solver]"
      - name: "Corpus regression: dense n10 sampling + classic 19-graph corpus + anchor sweep + polarity + golden archetype gate"
        env:
          STDRAW_CI_PHASES: B2,H2,J,H3,M
        run: python tests/ci_checks.py

  checks-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Internal-leak sanitization gate"
        run: python scripts/check_internal_leaks.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "Install (solver layer: ortools exact tests)"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[solver]"
          pip install pytest
      - name: "Unit gates: visibility units + ortools exact + layout modes + language policy"
        env:
          STDRAW_CI_PHASES: D,E,H,K
        run: python tests/ci_checks.py
      - name: "Docs consistency gate (pytest wrapper, v0.7.15)"
        run: pytest -q tests/test_docs_consistency.py

  checks-pytest:
    # Full pytest suite (8de1d15) as its own parallel lane: heavy
    # (~18min locally, scalability wall-clock dominates) and must not
    # lengthen any other job. 2026-11-26 CI-speed card, phase 1: xdist
    # 2 workers (loadscope) + BLAS/OMP pinned to 1 thread per worker —
    # 2 workers x CP-SAT multithreading would otherwise oversubscribe the
    # 2-core runner. Phase 2 (public repo, standard runners free): the
    # suite splits into 4 matrix shards via pytest-split, each shard still
    # running -n 2 loadscope; the committed .test_durations feeds the
    # least_duration algorithm (single-test floor: test_scalability).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: "Internal-leak sanitization gate"
        run: python scripts/check_internal_leaks.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "Install (full optional layers + pytest)"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[solver,measure,render-check]"
          pip install pytest pytest-xdist pytest-split
      - name: "Resolve playwright version"
        id: pwver
        run: echo "ver=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pwver.outputs.ver }}
      - name: "Playwright chromium (skips download on cache hit)"
        run: playwright install chromium
      - name: "Full pytest suite, shard ${{ matrix.group }}/4 (unit + regression + brute-force + scalability wall-clock + playwright font-env)"
        run: >-
          python -m pytest tests/ -q -n 2 --dist=loadscope
          --splits 4 --group ${{ matrix.group }}
          --splitting-algorithm least_duration

  checks-py39-weekly:
    # 3.9 full-compatibility sweep for the declared floor (pyproject:
    # requires-python >= 3.9): weekly schedule, plus manual dispatch so a failed
    # sweep can be re-run without waiting a week; never on push/pr.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Pinned image, not ubuntu-latest. ubuntu-latest migrated to 26.04, and the
    # setup-python versions manifest ships 3.9 builds only for 22.04/24.04
    # (newest 3.9.25: linux-22.04 / linux-24.04, no 26.04 build at all). On
    # 26.04 the job died inside setup-python with "The version '3.9' with
    # architecture 'x64' was not found for Ubuntu 26.04" before installing a
    # single dependency (runs 44894934217, 46139007908). Pinning 24.04 keeps the
    # declared floor verifiable without touching requires-python.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: "Internal-leak sanitization gate"
        run: python scripts/check_internal_leaks.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "Install (full optional layers)"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[solver,measure,render-check]"
          playwright install chromium
      - name: "Full checks (all phases): auto hard gates + DOM bounds + determinism"
        run: python tests/ci_checks.py
