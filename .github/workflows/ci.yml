name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: "Internal-leak sanitization gate"
        run: python scripts/check_internal_leaks.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Install (optional layers: solver + measure + render-check)"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[solver,measure]"
          pip install playwright
          playwright install chromium
      - name: CLI help smoke
        run: |
          stdraw --help
          python -m stdraw layout --help
      - name: "Full checks: ortho byte-regression + auto hard gates + DOM bounds + determinism"
        run: python tests/ci_checks.py
